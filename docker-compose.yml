services:
  db:
    image: postgres:15-alpine
    container_name: metashield_db
    environment:
      POSTGRES_USER: metashield
      POSTGRES_PASSWORD: metashield_password
      POSTGRES_DB: metashield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: metashield_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
